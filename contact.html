<!DOCTYPE html>
<html>
<head>

<title>Contact - Ivy Blog</title>
<style>
  body {
    font-family: 'Times New Roman', Times, serif;
    background: rgb(227, 237, 245);
    color: #222;
  }

  .page {
    max-width: 1000px;
    margin: 30px auto;
    border: 12px solid #9b6310;
    border-radius: 12px;
    padding: 24px 30px 40px;
    background: antiquewhite;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  header img.logo {
    height: 36px;
  }

  nav a {
    margin-left: 20px;
    text-decoration: none;
    color: #222;
    font-size: 14px;
  }

  h1.site-title {
    text-align: center;
    font-size: 28px;
    margin-bottom: 20px;
  }

  p {
    font-size: 20px;
    color: #444;
  }

  form {
    max-width: 400px;
    margin: 20px auto;
    text-align: center;
  }

  form input, form textarea {
    width: 90%;
    padding: 10px;
    margin-bottom: 15px;
    border: 2px solid #9b6310;
    border-radius: 6px;
    font-family: 'Times New Roman', Times, serif;
    font-size: 16px;
  }

  form button {
    background-color: rgb(148, 80, 3);
    color: white;
    border: none;
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 16px;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    padding-top: 16px;
    font-size: 15px;
    color: #070404;
  }
</style>
</head>
<body>

<div class="page">

  <header>
    <img class="logo" src="images/logo.png" alt="Logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <h1 class="site-title">CONTACT US</h1>

  <p style="text-align:center;">
    Got a question or just want to say hi? Fill out the form below.
  </p>

  <form>
    <input type="text" placeholder="Your Name"><br>
    <input type="email" placeholder="Your Email"><br>
    <textarea rows="5" placeholder="Your Message"></textarea><br>
    <button type="button">Send Message</button>
  </form>

  <footer>
    &copy; 2026 Ivy Blog. All rights reserved.
  </footer>

</div>

</body>
</html>
